[package]
name = "market_microstructure"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
envconfig = "0.11.1"
dotenv = "0.15.0"
sha1 = "0.11"
base64 = "0.23.1"
rand = "0.10.3"
rustls = "0.23"
rustls-pki-types = "1.0"
webpki-roots = "0.26"
ed25519-dalek = "2"
plotters = "0.3.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true

[[bin]]
name = "prediction_model"
path = "src/bin/prediction_model/predict.rs"

[[bin]]
name = "train_model"
path = "src/bin/train_model/train.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest_model/backtest.rs"

[[bin]]
name = "aggregate"
path = "src/bin/aggregate_trade/aggregate_flow.rs"
