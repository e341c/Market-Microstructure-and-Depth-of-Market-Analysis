[package]
name = "market_microstructure"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
envconfig = "0.11.1"
dotenv = "0.15.0"
sha1 = "0.11"
base64 = "0.23.1"
rand = "0.10.3"
rustls = "0.23"
rustls-pki-types = "1.0"
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"